  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0F172A">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">

  <meta name="apple-mobile-web-app-title" content="TreinaCheck">
  <script>
    (function () {
      try {
        var key = 'treinacheck-theme';
        var stored = localStorage.getItem(key);
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
        var palette = localStorage.getItem('treinacheck-theme-palette');
        if (palette === 'oceano' || palette === 'pitaya' || palette === 'uva' || palette === 'esmeralda' || palette === 'americana' || palette === 'feira' || palette === 'botanica' || palette === 'pedro') {
          document.documentElement.classList.add('theme-' + palette);
        }
      } catch (e) {}
    })();
  </script>
  <script>
    (function () {
      try {
        var scale = localStorage.getItem('treinacheck-a11y-scale');
        var sizes = { normal: '16px', large: '18px', xlarge: '20px' };
        if (scale && sizes[scale]) {
          document.documentElement.style.fontSize = sizes[scale];
          document.documentElement.dataset.fontScale = scale;
        }
        if (localStorage.getItem('treinacheck-a11y-bold') === '1') {
          document.documentElement.classList.add('a11y-bold');
        }
        if (localStorage.getItem('treinacheck-a11y-contrast') === '1') {
          document.documentElement.classList.add('a11y-contrast');
        }
      } catch (e) {}
    })();
  </script>
</head>

  <body>
    <div id="root"></div>
    <noscript>
      <div style="min-height:100svh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e5e7eb;font-family:system-ui,sans-serif;padding:24px;text-align:center">
        <div>
          <h1 style="font-size:20px;margin:0 0 8px">O JavaScript está desativado</h1>
          <p>O TreinaCheck precisa de JavaScript habilitado para funcionar.</p>
        </div>
      </div>
    </noscript>
    <script>
      // "Watchdog" de abertura: se o React não montar em 6s (ex.: navegador com
      // uma versão antiga do HTML em cache pedindo arquivos que não existem
      // mais), mostramos uma instrução clara em vez de uma tela preta.
      (function () {
        var deadline = Date.now() + 6000;
        var timer = window.setInterval(function () {
          var root = document.getElementById("root");
          if (root && root.childElementCount > 0) {
            window.clearInterval(timer);
            return;
          }
          if (Date.now() < deadline) return;
          window.clearInterval(timer);
          if (root && root.childElementCount > 0) return;
          var box = document.createElement("div");
          box.style.cssText = "min-height:100svh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e5e7eb;font-family:system-ui,sans-serif;padding:24px;text-align:center";
          box.innerHTML = '<div style="max-width:440px"><p style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#94a3b8;margin:0">TreinaCheck</p><h1 style="font-size:21px;margin:10px 0 12px">A página não abriu por completo</h1><p style="font-size:14px;color:#cbd5e1;margin:0 0 18px">Isso costuma ser uma versão antiga em cache. Recarregue com <strong>Ctrl+Shift+R</strong> (ou Cmd+Shift+R no Mac). Se persistir, limpe os dados do site para o endereço agendause.vercel.app.</p><button onclick="window.location.reload()" style="border:1px solid #f97316;background:#f97316;color:#111827;border-radius:12px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer">Recarregar agora</button></div>';
          document.body.appendChild(box);
        }, 500);
      })();
    </script>
    <script src="/lovable-customization.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
